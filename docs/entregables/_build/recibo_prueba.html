<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#f3f3f1;}
  .hoja{
    width:480px; min-height:680px; background:#ffffff; margin:20px auto;
    padding:36px 32px; box-sizing:border-box;
    font-family:'Courier New', monospace; color:#111;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  h1{font-size:22px; text-align:center; margin:0 0 4px; letter-spacing:1px;}
  .empresa{text-align:center; font-size:15px; margin-bottom:18px;}
  .linea{border-top:2px dashed #333; margin:16px 0;}
  .fila{display:flex; justify-content:space-between; font-size:16px; margin:8px 0;}
  .fila b{font-weight:700;}
  .total{font-size:22px; font-weight:700; text-align:center; margin:22px 0; padding:14px; border:3px solid #111;}
  .venc{font-size:16px; text-align:center; margin-top:10px;}
  .pie{text-align:center; font-size:13px; margin-top:24px; color:#333;}
</style>
</head>
<body>
  <div class="hoja">
    <h1>RECIBO DE ENERGÍA ELÉCTRICA</h1>
    <div class="empresa">Empresa Eléctrica de Lima</div>
    <div class="linea"></div>
    <div class="fila"><span>Titular:</span><b>Lucía Ramos</b></div>
    <div class="fila"><span>N° de suministro:</span><b>10234567</b></div>
    <div class="fila"><span>Periodo:</span><b>Agosto 2026</b></div>
    <div class="fila"><span>Consumo:</span><b>145 kWh</b></div>
    <div class="linea"></div>
    <div class="total">TOTAL A PAGAR<br>S/ 87.40</div>
    <div class="venc">Fecha de vencimiento: 12/09/2026</div>
    <div class="linea"></div>
    <div class="pie">Gracias por su pago puntual.<br>Conserve este recibo.</div>
  </div>
</body>
</html>
