org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Sin esto, el primer build falla en este entorno con "Unable to establish
# loopback connection": el demonio de Gradle necesita abrir un socket local
# para hablar con el proceso que lo invoca, y ese socket queda bloqueado
# aquí. Sin demonio, Gradle corre todo en el mismo proceso y lo evita.
org.gradle.daemon=false
# El JDK 25 que trae Android Studio tiene un bug de red en Windows que
# rompe ese mismo socket local incluso sin demonio ("Unable to establish
# loopback connection"). El JDK 21 no lo tiene.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.101-hotspot
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
